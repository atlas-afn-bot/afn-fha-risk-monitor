name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — no root staticwebapp.config.json
        # The canonical SWA config lives at public/staticwebapp.config.json (Vite copies
        # public/ into dist/, which is what SWA deploys). A file at the repo root is
        # silently ignored and causes confusing bugs. See docs/swa-config-location.md.
        run: |
          if [ -f "staticwebapp.config.json" ]; then
            echo "::error file=staticwebapp.config.json::Root-level staticwebapp.config.json is not deployed by Azure SWA. Edit public/staticwebapp.config.json instead. See docs/swa-config-location.md."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint (best-effort)
        # Lint script exists in package.json but eslint isn't a declared devDependency;
        # skip cleanly if eslint isn't installed rather than failing CI.
        run: |
          if npx --no-install eslint --version >/dev/null 2>&1; then
            npm run lint
          else
            echo "eslint not installed — skipping (add eslint to devDependencies to enable)"
          fi

      - name: Test
        # Vitest is declared but no tests may exist yet
        run: npm run test --if-present -- --passWithNoTests || echo "tests skipped or none defined"

      - name: Build
        run: npm run build
